<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Voxel Tactics</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect x=%222%22 y=%222%22 width=%2212%22 height=%2212%22 fill=%22%234fd3ff%22/%3E%3C/svg%3E">
    <link rel="stylesheet" href="/src/styles/game.css">
</head>
<body>
    <div id="app">
        <canvas id="view"></canvas>
        <div id="hud"></div>
        <div id="cutin-layer"></div>
        <div id="float-layer"></div>
        <div id="menu"></div>
        <!-- PLAN-14: visible from the first paint; main.js hides it for the menu and drives it while a battle loads. -->

    </div>
    <script type="module" src="/src/main.js"></script>
